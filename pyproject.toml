[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "thesis-pipeline"
version = "0.1.0"
description = "Pipeline for the cryptocurrency-sentiment master thesis."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Philip Oborgmann" }]
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "pyyaml>=6.0",
    "pyarrow>=12.0",
    "openpyxl>=3.1",
    "scikit-learn>=1.3",
    # joblib + threadpoolctl are imported directly by the panel-logit
    # chunk parallelism (--n-jobs); declare them explicitly rather than
    # relying on scikit-learn's transitive install.
    "joblib>=1.3",
    "threadpoolctl>=3.1",
    "scipy>=1.10",
    "statsmodels>=0.14",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "tqdm>=4.65",
    "vaderSentiment>=3.3",
]

[project.optional-dependencies]
transformers = [
    "torch>=2.0",
    "transformers>=4.30",
    "accelerate>=0.20",
]
tests = [
    "pytest>=7.0",
]

[project.scripts]
thesis-pipeline = "thesis_pipeline.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
