# Backtest / economic-evaluation configuration.
#
# Consumed by :mod:`thesis_pipeline.evaluation.economic`. The CLI flag
# ``evaluate-signals --backtest-config path/to/file.yaml`` overrides this
# default; ``--transaction-cost-bps`` overrides the cost grid only.
#
# The backtest is a **cross-sectional High-Low portfolio**:
#   * For each timestamp t, the model produces a probability per coin.
#   * The top-quantile coins by probability form the equal-weight long leg
#     (long weights sum to +1).
#   * The bottom-quantile coins form the equal-weight short leg
#     (short weights sum to -1).
#   * Net exposure ≈ 0 (dollar-neutral); gross exposure = 2.
#   * portfolio_log_return_t = mean(forward_long) − mean(forward_short).
#   * Transaction costs are charged on portfolio-level turnover, computed
#     from per-asset weight changes.
#   * Returns are *log returns* throughout; ``annualized_simple_return`` is
#     derived as ``expm1(annualized_log_return)``.
#   * Drawdown is the percentage drawdown on the equity curve
#     ``exp(cumulative_log_return)``.
#
# ⚠  Previous versions treated every (ticker × timestamp) observation as a
#    separate trading row. That over-counted periods-per-year by the
#    cross-section size (≈ 24× for the thesis universe) and inflated Sharpe
#    and cumulative return. All historical economic_* numbers from that
#    code path should be discarded and re-run.

portfolio_mode: high_low

# Quantile cutoffs (computed cross-sectionally per timestamp, on the model
# probabilities). long_quantile = 0.8 keeps the top 20 % by probability;
# short_quantile = 0.2 keeps the bottom 20 %.
long_quantile:  0.8
short_quantile: 0.2

# Minimum number of assets needed on each leg for the portfolio to trade
# the timestamp. ``allow_single_leg: false`` means: if one leg is empty,
# the timestamp is skipped entirely (no half-portfolio).
min_assets_per_leg: 1
allow_single_leg:   false

# Weighting scheme inside each leg. Only equal-weight is implemented today
# — value-weighted / probability-weighted are future work.
weighting: equal_weight

# Conviction-band thresholds for the threshold backtest. Long if p > t,
# short if p < 1 − t, else flat. Not the same as a classification
# threshold (see :func:`summarize_high_low_threshold_backtest`).
thresholds:
  - 0.55
  - 0.60
  - 0.65

# Transaction-cost grid in basis points (1 bps = 1/10000). Costs apply to
# portfolio-level turnover ``0.5 · sum_i |w_t,i − w_{t-1,i}|``.
transaction_cost_bps:
  - 0
  - 5
  - 10

# Annualisation. ``crypto`` uses ``crypto_calendar_days`` (365); a tradFi
# 252-day calendar can be requested by setting ``crypto_calendar_days: 252``.
annualization_mode: crypto
crypto_calendar_days: 365

risk_free_rate: 0.0

# Sets to use as economic benchmarks for lift columns (v4: ECON only —
# the legacy `B1` rolling-probability sentinel is the NAIVE evaluation
# reference, not a feature set, and the old `B2` lag-only logistic was
# folded into the v4 ECON information set).
benchmark_ids:
  - ECON

# Equal-weight long-only buy-and-hold reference computed from raw close
# prices when locally available. One row per (horizon × cost_bps).
include_buy_and_hold: true
