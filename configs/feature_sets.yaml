# Feature-set definitions — v4 (Variante A, 17 sets).
#
# Designed to eliminate identified engagement-related look-ahead leakage.
# This YAML is the version-controlled mirror of feature_sets.xlsx; the
# registry loader prefers the XLSX when present, otherwise falls back here.
#
# Structure:
#   * ECON                      — economic-only benchmark.
#   * SENT_{VAD|CBT}_{block}    — sentiment-only, one per (vader, cryptobert).
#   * ECON_{VAD|CBT}_{block}    — combined = ECON core + sentiment block.
#
# Blocks (title-based, no engagement weighting):
#   * L   = {m}_title_score_mean
#   * LD  = + {m}_title_score_std
#   * DA  = {m}_bullishness_ratio, log1p_post_count
#   * F   = all four (mean, std, bullishness, log1p_post_count)
#
# Diagnostic-only columns kept in the merged frame but NOT in the 17-set grid:
# has_posts, {m}_directional_post_count, {m}_combined_score_mean,
# {m}_selftext_score_mean (robustness / supplementary analyses only).

source_of_truth: "feature_sets.xlsx"

# ECON core, repeated identically across every combined set for transparency.
econ_core:
  - log_return_t
  - cum_log_return_7d
  - cum_log_return_14d
  - cum_log_return_21d
  - realized_vol_14d
  - volume_diff
  - log_market_cap_lag1

sets:

  # ---------------------------------------------------------------------
  # ECON — economic-only benchmark
  # ---------------------------------------------------------------------
  ECON:
    category: benchmark
    sentiment_model: none
    label: "Economic-only benchmark (ECON core)"
    features:
      - log_return_t
      - cum_log_return_7d
      - cum_log_return_14d
      - cum_log_return_21d
      - realized_vol_14d
      - volume_diff
      - log_market_cap_lag1

  # ---------------------------------------------------------------------
  # SENT_VAD_* — sentiment-only, VADER
  # ---------------------------------------------------------------------
  SENT_VAD_L:
    category: sentiment
    sentiment_model: vader
    label: "VADER title score mean (L)"
    features:
      - vader_title_score_mean

  SENT_VAD_LD:
    category: sentiment
    sentiment_model: vader
    label: "VADER title score mean + std (LD)"
    features:
      - vader_title_score_mean
      - vader_title_score_std

  SENT_VAD_DA:
    category: sentiment
    sentiment_model: vader
    label: "VADER bullishness ratio + log1p_post_count (DA)"
    features:
      - vader_bullishness_ratio
      - log1p_post_count

  SENT_VAD_F:
    category: sentiment
    sentiment_model: vader
    label: "VADER full sentiment block (F)"
    features:
      - vader_title_score_mean
      - vader_title_score_std
      - vader_bullishness_ratio
      - log1p_post_count

  # ---------------------------------------------------------------------
  # SENT_CBT_* — sentiment-only, CryptoBERT
  # ---------------------------------------------------------------------
  SENT_CBT_L:
    category: sentiment
    sentiment_model: cryptobert
    label: "CryptoBERT title score mean (L)"
    features:
      - cryptobert_title_score_mean

  SENT_CBT_LD:
    category: sentiment
    sentiment_model: cryptobert
    label: "CryptoBERT title score mean + std (LD)"
    features:
      - cryptobert_title_score_mean
      - cryptobert_title_score_std

  SENT_CBT_DA:
    category: sentiment
    sentiment_model: cryptobert
    label: "CryptoBERT bullishness ratio + log1p_post_count (DA)"
    features:
      - cryptobert_bullishness_ratio
      - log1p_post_count

  SENT_CBT_F:
    category: sentiment
    sentiment_model: cryptobert
    label: "CryptoBERT full sentiment block (F)"
    features:
      - cryptobert_title_score_mean
      - cryptobert_title_score_std
      - cryptobert_bullishness_ratio
      - log1p_post_count

  # ---------------------------------------------------------------------
  # ECON_VAD_* — combined ECON core + VADER block
  # ---------------------------------------------------------------------
  ECON_VAD_L:
