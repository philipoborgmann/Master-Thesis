# Pipeline stage configuration.
# Each stage references inputs/outputs by path-key (see configs/paths.yaml)
# and is implemented by the package module named in `module:` — the single
# source of truth. (The historical root-level scripts were retired; there is
# no longer a `script:` field.)

stages:

  validate_price:
    module: "thesis_pipeline.price.validate"
    inputs:
      - raw_price_root
      - cmc_root
    outputs:
      - price_validation_root
    heavy: false
    supports_smoke: true
    smoke:
      horizon: "1d"
      coins: [BTC, ETH]

  create_price_features:
    module: "thesis_pipeline.price.features"
    inputs:
      - raw_price_root
      - cmc_market_cap
    outputs:
      - price_features_pattern
      - feature_generation_report
      - cmc_marketcap_column_matches
    heavy: false
    supports_smoke: true
    smoke:
      horizon: "1d"
      coins: [BTC, ETH]

  load_sentiment:
    module: "thesis_pipeline.sentiment.load"
    inputs:
      - raw_sentiment_root
      - subreddit_ticker_mapping
    outputs:
      - sentiment_combined
      - descriptive_root
    heavy: true
    supports_smoke: true
    smoke:
      max_rows: 10000

  score_vader:
    module: "thesis_pipeline.sentiment.score_vader"
    inputs:
      - sentiment_combined
    outputs:
      - sentiment_scored_vader
    heavy: false
    supports_smoke: true
    smoke:
      max_rows: 5000

  # score_finbert: removed (FinBERT was dropped from the pipeline because it
  # is trained on financial / analyst language and produced no meaningful
  # variation on Reddit/crypto sentiment data — see docs/refactor_log.md).

  score_cryptobert:
    module: "thesis_pipeline.sentiment.score_cryptobert"
    inputs:
      - sentiment_combined
    outputs:
      - sentiment_scored_cryptobert
      - cryptobert_checkpoints
    heavy: true
    supports_smoke: true
    smoke:
      max_rows: 200

  create_sentiment_features:
    module: "thesis_pipeline.sentiment.aggregate"
    inputs:
      - sentiment_scored_vader
      - sentiment_scored_cryptobert
    outputs:
      - sentiment_features_pattern
      - sentiment_coverage
    heavy: false
    supports_smoke: true
    smoke:
      horizon: "1d"
      max_rows: 10000
      no_plots: true

  stationarity:
    module: "thesis_pipeline.sentiment.stationarity"
    inputs:
      - sentiment_features_pattern
    outputs:
      - stationarity_records
      - stationarity_results
      - stationarity_plots
    heavy: true
    supports_smoke: true
    smoke:
      horizon: "1d"
      coins: [BTC, ETH]

  merge_features:
    module: "thesis_pipeline.features.merge"
    inputs:
      - price_features_pattern
      - sentiment_features_pattern
      - sentiment_coverage
    outputs:
      - final_features_pattern
      - merge_report
    heavy: false
    supports_smoke: true
    smoke:
      horizon: "1d"

  run_models:
    module: "thesis_pipeline.modeling.run_models"
    inputs:
      - final_features_pattern
      - feature_sets_xlsx
    outputs:
      - signals_pattern
      - signals_metrics
    heavy: true
    supports_smoke: true
    smoke:
      horizon: "1d"
      set_id: "ECON"
      coins: [BTC, ETH]

  evaluate_signals:
    module: "thesis_pipeline.evaluation.evaluate_signals"
    inputs:
      - signals_root
      - feature_sets_xlsx
      - raw_price_1d
    outputs:
      - evaluation_xlsx
      - evaluation_completeness_csv
      - evaluation_pooled_csv
      - evaluation_per_ticker_csv
      - evaluation_thresholds_csv
      - evaluation_volatility_csv
    heavy: false
    supports_smoke: true
    smoke:
      horizon: "1d"

  diagnostics:
    module: "thesis_pipeline.diagnostics.sample_report"
    inputs:
      - final_features_pattern
      - signals_pattern
    outputs:
      - diagnostics_root
    heavy: false
    supports_smoke: true
    smoke:
      horizon: "1d"

# Order in which stages run for `run-pipeline` when no --stages list is given.
default_order:
  - validate_price
  - create_price_features
  - load_sentiment
  - score_vader
  - score_cryptobert
  - create_sentiment_features
  - stationarity
  - merge_features
  - run_models
  - evaluate_signals
  - diagnostics
